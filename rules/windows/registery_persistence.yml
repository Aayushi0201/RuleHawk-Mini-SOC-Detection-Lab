title: Registry Run Key Persistence
id: RH-WIN-003
description: Detects registry Run key modification commonly used for persistence
category: persistence
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    process_name: reg.exe
    command_line_contains:
      - "CurrentVersion\\Run"
      - "reg add"
  condition: selection
level: high
tags:
  - attack.t1547.001