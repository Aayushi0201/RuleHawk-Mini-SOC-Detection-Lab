title: Certutil File Download
id: RH-WIN-002
description: Detects certutil usage for downloading files
category: command_and_control
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    process_name: certutil.exe
    command_line_contains:
      - "-urlcache"
      - "http"
  condition: selection
level: high
tags:
  - attack.t1105
