title: SSH Brute Force Attempt
id: RH-LNX-001
description: Detects multiple failed SSH login attempts from the same source IP
category: credential_attack
logsource:
  product: linux
  category: auth
detection:
  selection:
    message_contains:
      - "Failed password"
      - "Invalid user"
  condition: selection
aggregation:
  group_by: src_ip
  threshold: 5
  condition: count_greater_than
level: high
tags:
  - attack.t1110